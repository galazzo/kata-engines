name: release-audio-cpp

# Builds the patched audio.cpp and publishes it as a release tagged `<upstream tag>-kata<N>`. Any platform or
# variant not built here is served by Dojo from upstream.
# Running it again for the same revision adds or replaces the assets of the variants selected.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "kata revision number (the N of -kataN)"
        required: true
        default: "1"
      variants:
        description: "which builds to run"
        type: choice
        options: [all, cuda12, vulkan]
        default: all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create the release when it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(grep '^tag=' audio.cpp/UPSTREAM | cut -d= -f2)-kata${{ inputs.revision }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes "audio.cpp $tag with the patch in audio.cpp/patches and the pinned Sonic DLL"

  windows-cuda12:
    needs: release
    if: ${{ inputs.variants == 'all' || inputs.variants == 'cuda12' }}
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: "network"
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cufft", "cufft_dev", "thrust", "visual_studio_integration"]'
      - name: Build patched audio.cpp and Sonic
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          ./scripts/build.ps1 -Engine audio.cpp -Variant cuda12 -Revision ${{ inputs.revision }}
      - name: Pack the CUDA runtime
        shell: pwsh
        run: |
          $tag = ((Get-Content audio.cpp/UPSTREAM) -match '^tag=')[0].Substring(4)
          $dst = "cudart"
          robocopy "${{ env.CUDA_PATH }}\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll cufft64_*.dll
          # robocopy exits 1 when it copied files: only 8 and above is a failure.
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          Compress-Archive -Path "$dst\*" -DestinationPath "dist/audio-$tag-cudart-windows-x64-cuda12.8.zip"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = ((Get-Content audio.cpp/UPSTREAM) -match '^tag=')[0].Substring(4) + "-kata${{ inputs.revision }}"
          gh release upload $tag (Get-ChildItem dist/*.zip).FullName --clobber

  windows-vulkan:
    needs: release
    if: ${{ inputs.variants == 'all' || inputs.variants == 'vulkan' }}
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $v = (Invoke-RestMethod https://vulkan.lunarg.com/sdk/latest/windows.txt).Trim()
          curl.exe -L -o vulkan-sdk.exe "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe"
          ./vulkan-sdk.exe --accept-licenses --default-answer --confirm-command install
          "VULKAN_SDK=C:\VulkanSDK\$v" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$v\Bin" >> $env:GITHUB_PATH
      - name: Build patched audio.cpp and Sonic
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          ./scripts/build.ps1 -Engine audio.cpp -Variant vulkan -Revision ${{ inputs.revision }}
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = ((Get-Content audio.cpp/UPSTREAM) -match '^tag=')[0].Substring(4) + "-kata${{ inputs.revision }}"
          gh release upload $tag (Get-ChildItem dist/*.zip).FullName --clobber
